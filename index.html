<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="複数タスクを並行で進めるときに、どのタスクに何分使ったかを計測する排他ストップウォッチ。">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Link previews (LINE / Slack など). og:image は絶対URLでないと効かない。 -->
<meta property="og:type" content="website">
<meta property="og:title" content="Multitask Timer">
<meta property="og:description" content="Per-task stopwatches for parallel work: exactly one task runs at a time.">
<meta property="og:url" content="https://yukmmz.github.io/multitask-timer/">
<meta property="og:image" content="https://yukmmz.github.io/multitask-timer/icon-192.png">
<meta name="twitter:card" content="summary">
<title>Multitask Timer</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-brand">
    <h1 class="app-title">Multitask Timer</h1>
    <span id="appVersion" class="app-version" data-i18n-title="c.changelog" title="更新履歴"></span>
  </div>
  <div class="total">
    <span class="total-label" data-i18n="total">合計</span>
    <span id="total-time" class="total-time">00:00:00</span>
  </div>
  <button id="stop-all" class="btn btn-stop" type="button" data-i18n="stopAll">■ 全停止</button>
  <!-- Label and icon follow the state in syncFullscreenBtn(): corners out = expand, corners in = shrink -->
  <button id="fullscreen-btn" class="btn btn-icon" type="button" title="全画面表示" aria-label="全画面表示">
    <svg class="fs-icon fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg class="fs-icon fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"/></svg>
  </button>
  <button id="feedback-btn" class="btn btn-icon" type="button"
          data-i18n-title="c.feedback" data-i18n-aria-label="c.feedback" title="フィードバックを送る" aria-label="フィードバックを送る"><span class="fb-mark" aria-hidden="true">FB</span></button>
  <button id="help-btn" class="btn btn-icon" type="button"
          data-i18n-title="c.help" data-i18n-aria-label="c.help" title="使い方" aria-label="使い方">?</button>
  <button id="settings-btn" class="btn btn-icon" type="button"
          data-i18n-title="c.settings" data-i18n-aria-label="c.settings"
          title="設定" aria-label="設定" aria-expanded="false">⚙</button>
</header>

<main>
  <div id="tasks" class="tasks"></div>
</main>

<footer class="app-footer">
  <span id="target-total" class="target-total"></span>
</footer>

<!-- Settings sheet. The common rows (language, share, changelog, other apps,
     clear data) are the same in every yukmmz.github.io app; app rows sit between. -->
<div id="sheet-backdrop" class="backdrop" hidden></div>

<section id="settings-panel" class="sheet" hidden data-i18n-aria-label="c.settings" aria-label="設定">
  <div class="sheet-head">
    <h2 class="sheet-title" data-i18n="c.settings">設定</h2>
    <button id="settings-close" class="btn btn-icon" type="button"
            data-i18n-aria-label="c.close" data-i18n-title="c.close" aria-label="閉じる" title="閉じる">✕</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.language">言語</span>
    <select id="lang-select" class="sound-select" data-i18n-aria-label="c.language" aria-label="言語">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="taskCount">タスク数</span>
    <div class="stepper" role="group" data-i18n-aria-label="taskCount" aria-label="タスク数">
      <button id="task-minus" class="btn btn-round" type="button" data-i18n-aria-label="taskMinus" data-i18n-title="taskMinus" aria-label="タスクを減らす" title="タスクを減らす">−</button>
      <span id="task-count-value" class="stepper-value" aria-live="polite">3</span>
      <button id="task-plus" class="btn btn-round" type="button" data-i18n-aria-label="taskPlus" data-i18n-title="taskPlus" aria-label="タスクを増やす" title="タスクを増やす">＋</button>
    </div>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="sound">通知音</span>
    <select id="sound-select" class="sound-select" data-i18n-aria-label="soundKind" aria-label="通知音の種類"></select>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="soundCheck">動作確認</span>
    <button id="test-sound" class="btn" type="button">音をテスト</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n-html="autoStopWithTarget">自動停止<br><small>目安あり</small></span>
    <select id="auto-stop-extra" class="sound-select" data-i18n-aria-label="autoStopWithTargetAria" aria-label="目安時間があるタスクの自動停止"></select>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n-html="autoStopNoTarget">自動停止<br><small>目安なし</small></span>
    <select id="auto-stop-no-target" class="sound-select" data-i18n-aria-label="autoStopNoTargetAria" aria-label="目安時間がないタスクの自動停止"></select>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="measured">計測時間</span>
    <button id="reset-all" class="btn btn-danger" type="button" data-i18n="resetAll">すべて 00:00:00 に戻す</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.share">共有</span>
    <button id="qrBtn" class="btn" type="button" data-i18n="c.showQr">QR コードを表示</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.changelog">更新履歴</span>
    <button id="changelogBtn" class="btn" type="button" data-i18n="c.showChangelog">表示</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.otherApps">他のアプリ</span>
    <a id="otherAppsLink" class="btn" href="https://yukmmz.github.io/" target="_blank" rel="noopener"
       data-i18n="c.openPortal">アプリ一覧を開く</a>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.data">データ</span>
    <button id="clearDataBtn" class="btn btn-danger" type="button" data-i18n="c.clearData">保存データを消す</button>
  </div>
</section>

<template id="task-template">
  <section class="card" tabindex="0">
    <!-- .card-body is the size container: the text inside scales with the card's
         own width (cqi), not the viewport. The menu stays outside it, because a
         size container is also a containing block for position:fixed children. -->
    <div class="card-body">
      <div class="card-top">
        <span class="task-name-text">タスク</span>
        <button class="btn btn-icon task-menu-btn" type="button"
                data-i18n-title="taskMenu" data-i18n-aria-label="taskMenu"
                title="このタスクの設定" aria-label="このタスクの設定" aria-expanded="false">⋯</button>
      </div>

      <div class="time-wrap">
        <div class="task-time">00:00:00</div>
        <div class="task-target-view"></div>
        <div class="task-over"></div>
      </div>
    </div>

    <div class="task-menu" hidden>
      <label class="menu-field">
        <span class="menu-label" data-i18n="taskName">タスク名</span>
        <input class="task-name" type="text" maxlength="24" data-i18n-placeholder="taskName" data-i18n-aria-label="taskName"
               placeholder="タスク名" aria-label="タスク名">
      </label>

      <div class="menu-field">
        <span class="menu-label" data-i18n="target">目安時間</span>
        <span class="menu-target">
          <input class="task-target-h" type="number" min="0" max="24" step="1"
                 inputmode="numeric" placeholder="0" data-i18n-aria-label="targetHours" aria-label="目安時間（時間）">
          <span class="menu-unit" data-i18n="unitHours">時間</span>
          <input class="task-target-m" type="number" min="0" max="59" step="1"
                 inputmode="numeric" placeholder="0" data-i18n-aria-label="targetMinutes" aria-label="目安時間（分）">
          <span class="menu-unit" data-i18n="unitMinutes">分</span>
        </span>

        <!-- Touch devices get these instead; see the pointer: coarse rules. -->
        <div class="wheel-row">
          <div class="wheel task-wheel-h" tabindex="0" role="listbox"
               data-i18n-aria-label="targetHours" aria-label="目安時間（時間）"></div>
          <span class="menu-unit" data-i18n="unitHours">時間</span>
          <div class="wheel task-wheel-m" tabindex="0" role="listbox"
               data-i18n-aria-label="targetMinutes" aria-label="目安時間（分）"></div>
          <span class="menu-unit" data-i18n="unitMinutes">分</span>
          <div class="wheel-band" aria-hidden="true"></div>
        </div>
      </div>

      <button class="btn btn-danger task-reset" type="button" data-i18n="taskReset">時間リセット</button>
    </div>
  </section>
</template>

<!-- QR オーバーレイ: アプリURL（左）とソースリポジトリURL（右） -->
<div id="qrOverlay" hidden>
  <div class="qrcard">
    <div class="qrrow">
      <div class="qrcol">
        <div class="qrlabel">App</div>
        <img class="qrImg" src="qr.svg" alt="QR code for the app URL">
        <div class="qrurl" id="qrUrl"></div>
      </div>
      <div class="qrcol">
        <div class="qrlabel">Source</div>
        <img class="qrImg" src="src-qr.svg" alt="QR code for the source repository">
        <div class="qrurl" id="qrSrcUrl"></div>
      </div>
    </div>
    <button id="qrClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- 更新履歴: 新しい順。中身は main.js の CHANGELOG から組み立てる -->
<div id="changelogOverlay" hidden>
  <div class="qrcard changelog-card" role="dialog" data-i18n-aria-label="c.changelog" aria-label="更新履歴">
    <h2 class="changelog-title" data-i18n="c.changelog">更新履歴</h2>
    <div id="changelogList" class="changelog-list"></div>
    <button id="changelogClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- 使い方: ヘッダーの ? または ? キーで開く -->
<div id="helpOverlay" hidden>
  <div class="qrcard changelog-card help-card" role="dialog" data-i18n-aria-label="c.help" aria-label="使い方">
    <h2 class="changelog-title" data-i18n="c.help">使い方</h2>
    <div class="changelog-list help-body" data-i18n-html="help"></div>
    <button id="helpClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- Feedback: the header FB button opens this; sendFeedback() posts to the shared GAS web app -->
<div id="feedbackOverlay" hidden>
  <form id="feedbackForm" class="qrcard changelog-card feedback-card" role="dialog"
        data-i18n-aria-label="c.feedback" aria-label="フィードバックを送る" novalidate>
    <h2 class="changelog-title" data-i18n="c.feedback">フィードバックを送る</h2>
    <p class="feedback-lead" data-i18n="c.feedbackLead"></p>
    <textarea id="feedbackMessage" class="feedback-message" maxlength="2000" rows="6" required
              data-i18n-placeholder="c.feedbackPlaceholder" data-i18n-aria-label="c.feedbackMessage"></textarea>
    <input id="feedbackContact" class="feedback-contact" type="text" maxlength="200" autocomplete="email"
           data-i18n-placeholder="c.feedbackContact" data-i18n-aria-label="c.feedbackContact">
    <!-- honeypot: invisible to people, bots fill it in and are ignored by the server -->
    <input id="feedbackWebsite" class="feedback-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="feedback-note" data-i18n="c.feedbackNote"></p>
    <p id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></p>
    <div class="feedback-actions">
      <button id="feedbackClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
      <button id="feedbackSend" class="btn btn-primary" type="submit" data-i18n="c.feedbackSend">送信</button>
    </div>
  </form>
</div>

<script src="i18n.js"></script>
<script src="main.js"></script>
</body>
</html>
